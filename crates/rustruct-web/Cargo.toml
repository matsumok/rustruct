[package]
name = "rustruct-web"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rustruct-types.workspace = true
rustruct-calc.workspace = true
charta.workspace = true
dioxus.workspace = true
# 開け閉めやダイアログの振る舞い（Esc・外を押して閉じる・フォーカス・読み上げ）。見た目は付けず Tailwind で書く（#28）。
# crates.io にはまだ出ていないので、git の版を固定する
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "9a758255", default-features = false }

# 継ぎ目 A（パス → HTML 文字列、src/prerender.rs）はネイティブだけ。ブラウザの WASM には入れない
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus-ssr.workspace = true

# tokens.json → @theme の生成器（src/theme.rs）は build.rs と test だけが使う。配信物には入らない
[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server"]
