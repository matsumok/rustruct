[package]
name = "rustruct-web"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rustruct-types.workspace = true
rustruct-calc.workspace = true
charta.workspace = true
dioxus.workspace = true
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "9a758255ea26e2b20c8cecf4c1c946feb9e71da7", version = "0.0.1" }

# 継ぎ目 A（パス → HTML 文字列、src/prerender.rs）はネイティブだけ。ブラウザの WASM には入れない
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus-ssr.workspace = true

# tokens.json → @theme の生成器（src/theme.rs）は build.rs と test だけが使う。配信物には入らない
[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true

[features]
default = []
web = ["dioxus/web", "dioxus-primitives/web"]
server = ["dioxus/server"]
