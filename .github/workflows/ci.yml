name: CI

# push ごとに回す。同じリポジトリのブランチからの PR には push の結果がそのまま表示されるので
# pull_request トリガーは付けない（付けると PR ブランチへの push が二重に走る）。
on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt / deps / clippy / wasm / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check

      - name: deps (docs/stack.md の依存の向き)
        run: sh scripts/check-deps.sh

      - name: clippy (feature なし)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: clippy (server)
        run: cargo clippy -p rustruct-web --features server --locked -- -D warnings

      - name: check (web, wasm32)
        run: cargo check -p rustruct-web --features web --target wasm32-unknown-unknown --locked

      - name: test
        run: cargo test --workspace --locked
