name: CI

# push ごとに回す。同じリポジトリのブランチからの PR には push の結果がそのまま表示されるので
# pull_request トリガーは付けない（付けると PR ブランチへの push が二重に走る）。
# 各 step のコマンドは scripts/check.sh にある。手元でも同じものを回せる。
on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt / deps / markup / classes / clippy / wasm / test / theme / ssg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # dx が落とすツール（wasm-bindgen、wasm-opt、Tailwind）。鍵は dx の版
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/.dx/tools
          key: dx-tools-0.7.10

      # dx は GitHub Releases のビルド済みバイナリ（AGENTS.md と同じ 0.7.10）。cargo install は数分かかる
      - name: dx 0.7.10
        run: |
          curl -sSfL -o dx.tar.gz https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/dx-x86_64-unknown-linux-gnu.tar.gz
          echo "4363e4ed2a3f1eb7f4d38d2d59aed59ce43271c44c16b425e92c89a64761fbe7  dx.tar.gz" | sha256sum -c -
          tar xzf dx.tar.gz -C "$HOME/.cargo/bin" dx
          rm dx.tar.gz
          dx --version

      - name: fmt
        run: sh scripts/check.sh fmt

      - name: deps (docs/stack.md の依存の向き)
        run: sh scripts/check.sh deps

      - name: markup (マークアップに値を書かない)
        run: sh scripts/check.sh markup

      - name: classes (生成物 assets/tailwind.css がマークアップと合っている)
        run: sh scripts/check.sh classes

      - name: clippy (feature なし)
        run: sh scripts/check.sh clippy

      - name: clippy (server)
        run: sh scripts/check.sh server

      - name: check (web, wasm32)
        run: sh scripts/check.sh wasm

      - name: test
        run: sh scripts/check.sh test

      - name: theme.css が tokens.json と合っている
        run: sh scripts/check.sh theme

      - name: ssg (dx build --ssg の出力に住所ごとの HTML と WASM がある)
        run: sh scripts/check.sh ssg

      - name: assets/tailwind.css がマークアップと合っている (dx build が作り直した生成物に差分が無い)
        run: sh scripts/check.sh tailwind
