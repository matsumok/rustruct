[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/rustruct-web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
rustruct-types = { path = "crates/rustruct-types" }
rustruct-calc = { path = "crates/rustruct-calc" }
charta = { path = "crates/charta" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
rust_decimal = { version = "1.43", default-features = false }
rust_decimal_macros = { version = "1.40" }
dioxus = { version = "0.7", features = ["fullstack", "router"] }
dioxus-ssr = { version = "0.7" }
