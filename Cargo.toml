[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/rustruct-web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# 作業用のフォルダごとに target を持つので、dev（test が継ぐ）のデバッグ情報を絞る。依存は無し、
# 自前の crate は panic の行番号だけ。cargo test --workspace --no-run の target が 3.4G から 1.5G になる
# （2026-11-25 に測った）
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# 計算核だけは dev（test が継ぐ）でも最適化する。有限要素の連立は最適化なしだと数十倍遅く、
# rustruct-calc の素の cargo test（#[ignore] の縦横比 2・4 の分割数のテストを除く）が 21 秒から 18 分になる
# （2026-11-03 に測った）
[profile.dev.package.rustruct-calc]
opt-level = 2

[workspace.dependencies]
rustruct-types = { path = "crates/rustruct-types" }
rustruct-calc = { path = "crates/rustruct-calc" }
charta = { path = "crates/charta" }
numerus = { path = "crates/numerus" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
rust_decimal = { version = "1.43", default-features = false }
rust_decimal_macros = { version = "1.40" }
dioxus = { version = "0.7", features = ["fullstack", "router"] }
dioxus-ssr = { version = "0.7" }
web-sys = { version = "0.3" }
katex = { version = "0.4" }
pulldown-cmark = { version = "0.13", default-features = false }
